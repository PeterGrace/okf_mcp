# cargo-release 0.25.18; scripts/release-prepare.sh is the supported entry point.
allow-branch = ["main"]
shared-version = true
consolidate-commits = true
pre-release-commit-message = "chore: Release v{{version}}"
tag-name = "v{{version}}"
tag-message = "Release v{{version}}\n\nokf-release-prepare-v1"
pre-release-hook = ["python3", "scripts/release.py", "hook", "{{prev_version}}", "{{version}}"]
publish = false
push = false
# The hook runs the repository's checks instead of cargo publish verification.
verify = false
