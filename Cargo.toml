[package]
name = "okf_mcp"
default-run = "okf-mcp"
version = "0.14.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Peter Grace <pete.grace@gmail.com>"]

[lib]
name = "okf_mcp"
path = "src/lib.rs"

[[bin]]
name = "okf-mcp"
path = "src/main.rs"

[[bin]]
name = "okf-maintenance"
path = "src/bin/okf-maintenance.rs"

[dependencies]
# The HTTP server: routes, the auth middleware, extractors.
axum = "0.8.9"
# Application-level errors in the command line (the library uses OkfError).
anyhow = "1.0.104"
# Background jobs (Task 6 sends mail through them). Default features: the
# retry, timeout and tracing layers.
apalis = "1.0.0"
# apalis' job storage in the server's own Postgres. Default features
# (`migrate`, `tokio-comp`) use sqlx 0.9 with `tls-rustls-ring-webpki`, the
# same TLS backend as ours, so no second sqlx or TLS stack is linked. Its
# query macros check a live database when DATABASE_URL is set at build time:
# the justfile exports SQLX_OFFLINE=true.
apalis-postgres = "1.0.0"
# Password hashing (Task 4). Argon2id at OWASP's parameters by default;
# `hash_password` draws its own salt through getrandom.
argon2 = "0.6.0"
# `#[async_trait]` makes the `Mailer` trait usable as `Arc<dyn Mailer>`
# (Decision 10): native `async fn` in traits is not dyn-compatible.
async-trait = "0.1.92"
# API keys are 32 random bytes in unpadded base64url (`keys::generate`).
base64 = "0.23.1"
# Sizes with units in the configuration ("64MiB").
bytesize = { version = "2.7.0", features = ["serde"] }
# Wall-clock timestamps for catalog stamps (UTC only; no local-time database needed).
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
# The command line (`okf-mcp migrate | catalog | key | import | export`);
# `env` lets DATABASE_URL fill `--database-url`.
clap = { version = "4.6.7", features = ["derive", "env"] }
# Gzip for catalog archives (.tar.gz import and export).
flate2 = "1.1.10"
# Decoding `?catalogs=` on the MCP URL.
form_urlencoded = "1.2.2"
# The OS random source for API keys.
getrandom = "0.4.3"
# Durations with units in the configuration ("10s", "2h").
humantime-serde = "1.1.1"
# Insertion-ordered maps, matching Python dict order for frontmatter mappings.
indexmap = "2.14.2"
# SMTP (Task 6) in pure Rust: rustls with ring (as sqlx uses) and the
# webpki root store; `hostname` sends the real host name in EHLO. No
# default features: they pull in native-tls (OpenSSL).
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "ring", "webpki-roots", "hostname"] }
# OIDC sign-in (Task 9). No default features: they bring reqwest 0.12;
# `src/oidc.rs` adapts our reqwest 0.13 client instead (Decision 12).
# `accept-string-booleans`: some providers send `"email_verified": "true"`.
openidconnect = { version = "4.1.0", default-features = false, features = ["accept-string-booleans"] }
# Markdown to HTML for the web console (src/render.rs), which escapes raw
# HTML and filters link schemes itself. No default features: they only add
# getopts for pulldown-cmark's own command-line tool.
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
# Data parallelism for building snapshots and running analyses across documents.
rayon = "1.12.0"
regex = "1.13.1"
# Runner HTTP client and endpoint normalization, with explicit TLS support.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# MCP: the server handler, `#[tool]` macros, and the streamable HTTP service.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
# JSON schemas of tool parameters and results (rmcp builds on schemars 1).
schemars = "1.2.3"
# `Serialize` derives for the analysis reports, whose JSON must match okf.py's.
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order (Python dict
# order), so `Value::to_json` keeps frontmatter keys in source order.
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
# API keys are stored only as their SHA-256.
sha2 = "0.11.1"
# Unified diffs of a changeset against the published text (`pending_changes`).
similar = "2.7.0"
# Constant-time comparison of a presented key's hash with a stored one.
subtle = "2.6.1"
# Atomic writes via unique temp files (DiskWorkspace); also throwaway dirs in tests.
tempfile = "3.27.0"
# Catalog archives: .tar.gz import and export (with flate2).
tar = "0.4.46"
# Postgres access with runtime-checked queries, and the schema migrations
# embedded at compile time (`migrate!` needs `macros`). `json`: the
# `changeset_entries.replay` jsonb column as `serde_json::Value`.
# `tls-rustls-ring-webpki`: TLS in pure Rust (the binary links no OpenSSL).
# The deployment turns it on with `PGSSLMODE=verify-full` and
# `PGSSLROOTCERT`, which sqlx reads beneath the URL (M7). With a TLS backend
# compiled in, sqlx's default `sslmode=prefer` also tries TLS, unverified, on
# every connection that sets no mode (local runs, the CLI, the tests).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros", "json", "tls-rustls-ring-webpki"] }
thiserror = "2.0.6"
# The async runtime sqlx runs on, and the CLI's entry point.
# `time`: `tokio::time::interval` for the poll loop (and `sleep` in tests);
# `net`: the server's TCP listener; `signal`: SIGINT and SIGTERM.
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util", "fs"] }
# `CancellationToken`: one signal that stops the poll loop, rmcp's sessions
# and the HTTP server together (rmcp's config takes this type).
tokio-util = "0.7.20"
# The configuration file.
toml = "1.1"
# HTTP middleware: request tracing and timeouts.
tower-http = { version = "0.6.11", features = ["trace", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
# Parsing and checking OAuth URLs: CIMD client ids and redirect URIs
# (`src/oauth/clients.rs`). Already in the tree through reqwest; pinned to
# the same version so there is one copy.
url = "2.5.8"
# Passkeys (Task 8), pure RustCrypto. `conditional-ui` enables
# discoverable (username-less) sign-in. Ceremony state stays typed in
# memory (Decision 13), so no state-serialisation feature is needed.
webauthn-rs = { version = "0.6.2", features = ["conditional-ui"] }
# The WebAuthn types webauthn-rs' prelude does not re-export
# (`ResidentKeyRequirement`, and `AllowCredentials` in the tests; Decision 13).
# Pinned exactly, as webauthn-rs pins it.
webauthn-rs-proto = "=0.6.2"

[dev-dependencies]
# Property-based tests (Hypothesis-backed); the library is imported as `hegel`.
hegeltest = "0.50.3"
# The end-to-end tests talk to the server as a real MCP client would.
rmcp = { version = "3.8.0", features = ["client", "transport-streamable-http-client-reqwest"] }
# Certificates generated at test time for the TLS database test (never
# checked in: a key in the repository would trip secret scanners).
rcgen = "0.14.10"
# Throwaway Postgres containers for the database tests (needs Docker). Only
# the modules crate: it re-exports the testcontainers version it supports.
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
# `test-util`: paused time (`start_paused`), so a test of the 120-second
# request timeout runs at once.
tokio = { version = "1.54", features = ["test-util"] }
# `io`: `ReaderStream`, a request body that arrives as slowly as a test
# writes it (the import route's upload deadline).
tokio-util = { version = "0.7.20", features = ["io"] }
# `ServiceExt::oneshot`, to call an axum router in tests without a socket.
tower = { version = "0.5.3", features = ["util"] }
# Browser end-to-end tests of the web console (tests/ui_e2e): a native Rust
# Chromium driver (no Node). Its API is blocking; call it from spawn_blocking.
rustwright = "0.3.0"
# A WebSocket client for the browser journeys' raw DevTools calls (Chromium's
# virtual authenticator, `tests/ui_e2e/harness.rs`), which rustwright does
# not expose. Already in the tree through rustwright; the same version.
tungstenite = "0.29.0"
# A software passkey for the passkey tests (Task 8); no system libraries.
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }

# argon2 is roughly a hundred times slower unoptimized, and the password
# tests hash dozens of times; optimize it (and its BLAKE2) in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
